name: Release

# Publishes a tagged version to https://us-maven.pkg.dev/scalekit-public/java.
#
# Two ways to start it, both in the `release` environment (a second maintainer approves):
#   - publish a GitHub Release `vX.Y.Z`: publishes that tag;
#   - Actions > Release > Run workflow with a tag: publishes an existing tag, for example to
#     retry a failed run. With "dry run" set, it builds, signs and checks access to the
#     repository, then uploads the result as a workflow artifact instead of publishing.
#
# Published versions are immutable: `make publish` refuses a version that already exists.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v2.6.1"
        required: true
        type: string
      dry_run:
        description: "Dry run: build, sign and check access, but do not publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # GitHub OIDC token for the keyless login to Google Cloud

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Scalekit Maven repository
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Validate tag is a release tag on main
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a release tag (vX.Y.Z)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
            echo "Tag $TAG is not on main. Release only merged commits."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate tag matches pom.xml version
        run: |
          POM_VERSION="$(mvn -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$TAG" != "v$POM_VERSION" ]; then
            echo "Tag ($TAG) does not match pom.xml version ($POM_VERSION)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4

      - name: Check access to the repository
        run: gcloud artifacts repositories describe java --location=us --project=scalekit-public --format="value(name)"

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY is not set in the release environment."
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Dry run (build and sign; nothing is published)
        if: env.DRY_RUN == 'true'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: make publish-dry-run

      - name: Upload dry-run artifacts
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-dry-run-${{ env.TAG }}
          path: target/publish-dry-run
          if-no-files-found: error

      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: make publish
