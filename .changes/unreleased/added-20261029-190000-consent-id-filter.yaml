kind: added
body: |
  `client.resources().listUserConsents(resourceId, options)` accepts `consentIds` on `ListUserConsentsOptions` to fetch specific consents by ID, for example to find the `clientId` you need to revoke a consent you already hold the ID of. `consentIds` takes up to 25 distinct IDs in the `usrcnst_<number>` format and takes precedence over `userIds` and `search`; IDs that do not exist or belong to another resource are omitted from the result. Existing calls are unchanged. [Reference](https://github.com/scalekit-inc/scalekit-sdk-java/blob/main/REFERENCE.md)

  ```java
  ListResourceUserConsentsResponse response = scalekitClient.resources().listUserConsents(
      "res_123456",
      ListUserConsentsOptions.builder()
          .consentIds(Arrays.asList("usrcnst_145478546020631313", "usrcnst_143610996831814379"))
          .build());
  for (ResourceUserConsent consent : response.getConsentsList()) {
      System.out.println(consent.getId() + " " + consent.getClientId());
  }
  ```
