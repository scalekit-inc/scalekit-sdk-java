kind: added
body: |
  `client.tools()`, `client.connectedAccounts()` and `client.actions()` bring AgentKit to the Java SDK: connect your users' third-party accounts, find and run tools on their behalf, and call provider APIs through Scalekit's proxy with `client.actions().request(...)`. `client.tools()` offers `search`, `listScoped`, `listAvailable` and `execute`; `client.actions().mcp()` manages MCP configurations, and `client.actions().providers()` lists providers and manages custom ones. Failures throw `APIException` subclasses such as `NotFoundException` and `ToolUnauthorizedException`. [Reference](https://github.com/scalekit-inc/scalekit-sdk-java/blob/v2.6.0/REFERENCE.md#tools)

  ```java
  ConnectedAccount account = client.connectedAccounts().getOrCreate("gmail", "user_123");
  List<SearchedTool> found = client.tools().search("send an email",
      SearchToolsParams.builder().identifier("user_123").topK(5).build());
  ExecuteToolResult result = client.tools().execute("gmail_fetch_mails",
      ExecuteToolParams.builder().connectionName("gmail").identifier("user_123")
          .putToolInput("max_results", 5).build());
  ```
