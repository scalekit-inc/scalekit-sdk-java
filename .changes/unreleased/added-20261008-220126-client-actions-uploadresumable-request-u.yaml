kind: added
body: |
  `client.actions().uploadResumable(request)` uploads a file of any size to Google Drive, Cloud Storage and YouTube through a connected account: the content is sent in chunks (4 MiB by default), a failed chunk resumes instead of restarting, and the call returns the created resource as a map. `ResumableUploadRequest.builder(...).content(...)` takes a `byte[]`, a `Path` or an `InputStream`; if the upload session expires, the call throws `UploadSessionExpiredException` and does not start a new one. Like `client.actions().request(...)`, it only ever sends to `<environment URL>/proxy/`: a path with `.` or `..` segments, also percent-encoded or separated by `\`, throws `IllegalArgumentException` before anything is sent. [Reference](https://github.com/scalekit-inc/scalekit-sdk-java/blob/v2.6.0/REFERENCE.md#actions)

  ```java
  import com.scalekit.models.proxy.ResumableUploadRequest;

  Map<String, Object> file = client.actions().uploadResumable(
      ResumableUploadRequest.builder("googledrive", "user_123", "/upload/drive/v3/files")
          .content(Paths.get("video.mp4"))
          .contentType("video/mp4")
          .metadata(Collections.singletonMap("name", "video.mp4"))
          .onProgress(p -> System.out.println(p.bytesCommitted()))
          .build());
  System.out.println(file.get("id"));
  ```
