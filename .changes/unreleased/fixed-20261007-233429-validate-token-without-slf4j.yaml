kind: fixed
body: |
  `client.authentication().validateAccessToken(...)`, `validateAccessTokenAndGetClaims(...)` and `getIdpInitiatedLoginClaims(...)` previously threw `NoClassDefFoundError: org/slf4j/LoggerFactory` when `slf4j-api` was not on the classpath. They now work without any logging library.
