kind: added
body: |
  `client.tools().search(...)` ranks tools by relevance and readiness; `listScoped(...)` and `listAvailable(...)` list an identifier's tools. `client.connections()` adds `listAppConnections`, `createEnvironmentConnection`, `getEnvironmentConnection` and `updateEnvironmentConnection`; `client.actions().providers().listProviders(...)` lists providers. `client.actions()` also offers `searchTools`, `listScopedTools`, `listAvailableTools` and `listConnections`. [Reference](https://github.com/scalekit-inc/scalekit-sdk-java/blob/v2.6.0/REFERENCE.md#tools)

  ```java
  List<SearchedTool> tools = client.tools().search("send an email",
      SearchToolsParams.builder().identifier("user_123").topK(5).build());
  EnvironmentConnection gmail = client.connections().createEnvironmentConnection(
      CreateEnvironmentConnectionParams.appConnection("GMAIL").build());
  ```
