kind: changed
body: |
  This and later releases are published to Scalekit's public Maven repository at `https://us-maven.pkg.dev/scalekit-infrastructure/maven-public` instead of Maven Central. Add that repository to your build to upgrade; it needs no credentials. Versions up to 2.6.0 stay on Maven Central, so existing builds keep working unchanged. [Installation](https://github.com/scalekit-inc/scalekit-sdk-java#installation)

  ```gradle
  repositories {
      mavenCentral()
      maven { url "https://us-maven.pkg.dev/scalekit-infrastructure/maven-public" }
  }
  ```
